
name: Build FutureX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project files
        run: |
          pwd
          find . -maxdepth 5 -type f | sort

      - name: Restore secrets
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/futurex.jks"
          echo "$GS" | base64 -d > app/google-services.json
          echo "KEYSTORE_PATH=$RUNNER_TEMP/futurex.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FutureX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
